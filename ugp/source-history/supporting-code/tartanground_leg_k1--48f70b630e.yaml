model:
  world_d_model: 800
  world_heads: 10
  world_layers: 8
  world_ffn_ratio: 7
  use_leg_pretransformers: true
  leg_pre_d_model: 384
  leg_pre_heads: 8
  leg_pre_layers: 4
  leg_pre_ffn_ratio: 4
  leg_pre_residual_scale: 0.1

train:
  train_manifest: /path/to/ugp/merged_feelwm_v7_runs/tartanground_k1_k5_leg_compare/prepared/train_k1.jsonl
  val_manifest: /path/to/ugp/merged_feelwm_v7_runs/tartanground_k1_k5_leg_compare/prepared/dev_k1.jsonl
  output_dir: /path/to/ugp/merged_feelwm_v7_runs/tartanground_k1_k5_leg_compare/per_leg/k1
  indexed_data: true
  seed: 781
  epochs: 100
  max_steps: 200
  batch_size: 1
  grad_accum_steps: 8
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  lr: 0.0002
  min_lr_ratio: 0.05
  weight_decay: 0.05
  warmup_steps: 10
  grad_clip: 1.0
  amp_dtype: bf16
  tf32: true
  compile: false
  log_every: 1
  val_every_steps: 50
  checkpoint_every_steps: 50
  keep_last_checkpoints: 2
  resume: auto
  history_shift_samples: 10
  horizon_lambdas: [1.0]
