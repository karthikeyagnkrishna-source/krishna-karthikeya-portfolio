  init_weights_only: /path/to/ugp/merged_feelwm_v7_runs/tartanground_k1_k5_leg_compare/baseline/k1/checkpoints/best.pt
  teacher_forcing: true
  horizon_lambdas:
  - 0.516
  - 0.258
  - 0.129
  - 0.065
  - 0.032
  seed: 781
  epochs: 100
  max_steps: 20
  batch_size: 1
  grad_accum_steps: 8
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  lr: 0.0002
  min_lr_ratio: 0.05
  weight_decay: 0.05
  warmup_steps: 10
  grad_clip: 1.0
  amp_dtype: bf16
  tf32: true
  compile: false
  log_every: 1
  val_every_steps: 20
  checkpoint_every_steps: 20
  keep_last_checkpoints: 1
  resume: none
  history_shift_samples: 10
