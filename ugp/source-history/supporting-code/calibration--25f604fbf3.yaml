model:
  world_d_model: 800
  world_heads: 10
  world_layers: 8
  world_ffn_ratio: 7
  use_leg_pretransformers: false
train:
  train_manifest: /path/to/ugp/merged_feelwm_v7_runs/tartanground_k1_k5_leg_compare/prepared/train_k5.jsonl
  val_manifest: /path/to/ugp/merged_feelwm_v7_runs/tartanground_k1_k5_leg_compare/prepared/dev_k5.jsonl
  output_dir: /path/to/ugp/merged_feelwm_v7_runs/tartanground_k1_k5_leg_compare/lambda_calibration/strong_decay
