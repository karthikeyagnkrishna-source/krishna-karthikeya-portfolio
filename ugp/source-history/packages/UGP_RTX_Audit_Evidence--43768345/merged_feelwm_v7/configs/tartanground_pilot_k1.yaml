model:
  world_d_model: 800
  world_heads: 10
  world_layers: 8
  world_ffn_ratio: 7

train:
  train_manifest: /path/to/ugp/merged_feelwm_v7_runs/tartanground_pilot/prepared_k1/train_manifest.jsonl
  val_manifest: /path/to/ugp/merged_feelwm_v7_runs/tartanground_pilot/prepared_k1/val_manifest.jsonl
  output_dir: /path/to/ugp/merged_feelwm_v7_runs/tartanground_pilot/k1_train
  seed: 781
  epochs: 100
  max_steps: 200
  batch_size: 1
  grad_accum_steps: 4
  num_workers: 0
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: false
  lr: 0.0002
  min_lr_ratio: 0.05
  warmup_steps: 10
  grad_clip: 1.0
  amp_dtype: bf16
  tf32: true
  compile: false
  log_every: 1
  val_every_steps: 50
  checkpoint_every_steps: 50
  keep_last_checkpoints: 2
  resume: auto
  history_shift_samples: 10
